name: Build Wii Mobiclip Player

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write  # the release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dolxz build dependencies
      run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

    - name: Build Dependencies
      run: ./scripts/build_portlibs.sh

    - name: Build DOL
      run: make

    - name: Package App
      run: |
        mkdir -p artifact_root/apps/wii-mobiclip-player
        cp wii-mobiclip-player-xz.dol artifact_root/apps/wii-mobiclip-player/boot.dol
        if [ -f icon.png ]; then cp icon.png artifact_root/apps/wii-mobiclip-player/; fi
        if [ -f meta.xml ]; then cp meta.xml artifact_root/apps/wii-mobiclip-player/; fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wii-mobiclip-player
        path: artifact_root/

    - name: Zip release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
        (cd artifact_root && zip -r "$GITHUB_WORKSPACE/wii-mobiclip-player.zip" apps)

    - uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: wii-mobiclip-player.zip
